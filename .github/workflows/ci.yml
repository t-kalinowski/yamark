name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python tools
        run: |
          uv tool install ruff
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c("stringi", "jsonlite", "knitr"))
          install.packages(
            "yaml12",
            repos = c(
              "https://posit-dev.r-universe.dev",
              "https://cloud.r-project.org"
            )
          )
          stopifnot(packageVersion("yaml12") >= "0.1.0.9000")

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test

      - name: Test external CLI
        run: uv run external-tests/run.py --serial

      - name: Test VS Code extension
        working-directory: editors/vscode
        run: npm test
