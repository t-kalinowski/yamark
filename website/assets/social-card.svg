<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Yamark</title>
  <desc id="description">Format Markdown and YAML wherever they live.</desc>
  <rect width="1200" height="630" fill="#f7faf9"/>
  <rect x="0" y="0" width="16" height="630" fill="#0f766e"/>

  <g transform="translate(88 80)">
    <rect width="80" height="80" rx="15" fill="#1f2328"/>
    <path d="M17.5 22.5H30l10 18.75 10-18.75h12.5l-17.5 30V65H35V52.5l-17.5-30z" fill="#f6f8fa"/>
  </g>

  <text x="196" y="141" fill="#181b20" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Yamark</text>

  <text x="88" y="322" fill="#181b20" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="760" letter-spacing="-1.5">
    <tspan x="88" dy="0">Format Markdown and YAML</tspan>
    <tspan x="88" dy="84">wherever they live.</tspan>
  </text>

  <g transform="translate(88 500)">
